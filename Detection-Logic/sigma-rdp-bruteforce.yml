title: Windows RDP Brute Force Detection

id: 9f8c7a21-6c4e-4d0e-a123-rdpbf2026

status: test

description: Detects multiple failed Remote Desktop Protocol (RDP) authentication attempts that may indicate brute force activity against Windows systems.

author: Priyanka Rane

date: 2026-05-17

references:
  - https://attack.mitre.org/techniques/T1110/
  - https://attack.mitre.org/techniques/T1021/001/

logsource:
  product: windows
  service: security

detection:

  selection:
    EventID: 4625
    LogonType: 10

  timeframe: 5m

  condition: selection | count() by Computer > 20

falsepositives:
  - Users entering incorrect passwords repeatedly
  - Expired credentials
  - Misconfigured automated scripts
  - Administrative testing activities

level: high

tags:
  - attack.initial_access
  - attack.credential_access
  - attack.lateral_movement
  - attack.t1110
  - attack.t1110.001
  - attack.t1021.001
  - attack.rdp

fields:
  - Computer
  - TargetUserName
  - IpAddress
  - LogonType
  - EventID
