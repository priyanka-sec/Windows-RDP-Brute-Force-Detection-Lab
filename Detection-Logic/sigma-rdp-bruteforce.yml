title: Windows RDP Brute Force Detection

id: 9f8c7a21-6c4e-4d0e-a123-rdpbf2026

status: experimental

description: Detect multiple failed RDP authentication attempts which may indicate brute force activity.

author: Priyanka Rane

date: 2026-05-17

references:

- https://attack.mitre.org/techniques/T1110/

- https://attack.mitre.org/techniques/T1021/001/

logsource:

 product: windows

 service: security

detection:

 selection:

   EventID: 4625

   LogonType: 10

 timeframe: 5m

 condition: selection | count() by IpAddress > 5

falsepositives:

- User typing incorrect passwords

- Password reset activities

level: high

tags:

- attack.credential_access

- attack.t1110

- attack.lateral_movement

- attack.t1021.001
